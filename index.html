<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Login</title>

<style>
body {
  background:#111;
  color:white;
  font-family:Arial;
  display:flex;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

input,button {
  padding:10px;
  margin:5px;
}
</style>
</head>

<body>

<h2>Chess Login</h2>

<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<script>
function login() {
  const username = document.getElementById("u").value;
  const password = document.getElementById("p").value;

  if(!username || !password){
    alert("Fill all fields");
    return;
  }

  const session = {
    username,
    token: crypto.randomUUID(),
    time: Date.now()
  };

  localStorage.setItem("chess_auth", JSON.stringify(session));

  window.location.href = "chess.html";
}
</script>

</body>
</html>
