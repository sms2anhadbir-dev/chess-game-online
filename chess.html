<script>
const auth = JSON.parse(localStorage.getItem("chess_auth"));

if (!auth || !auth.token) {
  alert("Not authenticated");
  window.location.href = "index.html";
}

const game = new Chess();
const board = document.getElementById("board");

let selected = null;
let showLegend = false;

// ♟ PIECES
const pieces = {
 p:"♟",r:"♜",n:"♞",b:"♝",q:"♛",k:"♚",
 P:"♙",R:"♖",N:"♘",B:"♗",Q:"♕",K:"♔"
};

// ---------------- RENDER ----------------
function render() {
  board.innerHTML = "";
  const b = game.board();

  for (let r=0;r<8;r++) {
    for (let c=0;c<8;c++) {
      const sq = document.createElement("div");
      const name = String.fromCharCode(97+c)+(8-r);

      sq.dataset.square = name;
      sq.className = "square " + ((r+c)%2?"black":"white");

      const p = b[r][c];
      if (p) {
        sq.textContent = p.color==="w"
          ? pieces[p.type.toUpperCase()]
          : pieces[p.type];
      }

      sq.onclick = () => click(name);
      board.appendChild(sq);
    }
  }
}

// ---------------- MOVE SAFETY CHECK ----------------
function isDanger(move) {
  const sim = new Chess(game.fen());
  sim.move(move);

  const kingSquare = findKingSquare(sim);

  return sim.moves({ verbose:true }).some(m => m.to === kingSquare);
}

// find king position
function findKingSquare(g) {
  const b = g.board();
  for (let r=0;r<8;r++) {
    for (let c=0;c<8;c++) {
      const p = b[r][c];
      if (p && p.type==="k" && p.color===g.turn()) {
        return String.fromCharCode(97+c)+(8-r);
      }
    }
  }
  return null;
}

// ---------------- CLICK ----------------
async function click(sq) {
  if (!selected) {
    selected = sq;
    highlight(sq);
    return;
  }

  const move = {from:selected, to:sq, promotion:"q"};

  game.move(move);
  selected = null;

  render();
}

// ---------------- HIGHLIGHT SYSTEM ----------------
function highlight(sq) {
  clear();

  const moves = game.moves({square:sq, verbose:true});

  moves.forEach(m => {
    const el = [...document.querySelectorAll(".square")]
      .find(x => x.dataset.square === m.to);

    if (!el) return;

    const dangerous = isDanger({from:sq,to:m.to});
    const capture = m.captured;

    const mark = document.createElement("div");
    mark.className =
      "marker " +
      (capture ? "kill" : dangerous ? "danger" : "move");

    mark.textContent =
      capture ? "K" : dangerous ? "X" : "O";

    el.appendChild(mark);
  });
}

// ---------------- CLEAR ----------------
function clear() {
  document.querySelectorAll(".marker").forEach(m => m.remove());
}

// ---------------- LEGEND TOGGLE (KEY = L) ----------------
document.addEventListener("keydown", (e) => {
  if (e.key.toLowerCase() === "l") {
    showLegend = !showLegend;
    alert(
      "Legend:\n" +
      "O = Safe move\n" +
      "X = Dangerous move\n" +
      "K = Capture available"
    );
  }
});

render();
</script>
